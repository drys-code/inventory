<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f23">
<title>Инвентаризация</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0f0f23;color:#e0e0e0;line-height:1.5}

  /* ===== APP SHELL ===== */
  .app{height:100%;display:flex;flex-direction:column}
  .app-header{flex-shrink:0;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:12px 16px;border-bottom:1px solid #2a2a4a;display:flex;justify-content:space-between;align-items:center;z-index:100}
  .app-header h1{font-size:1.1rem;font-weight:700;color:#e94560;letter-spacing:.5px}
  .app-header .stats{display:flex;gap:10px;font-size:.72rem}
  .app-header .stat{background:rgba(233,69,96,.12);color:#e94560;padding:4px 10px;border-radius:20px;font-weight:600}

  .app-body{flex:1;position:relative;overflow:hidden;min-height:0}

  /* ===== PAGES ===== */
  .page{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;overflow:hidden}
  .page.active{display:flex}
  .page-scroll{flex:1;overflow-y:auto;padding:16px;padding-bottom:90px;-webkit-overflow-scrolling:touch}

  /* ===== SCANNER PAGE ===== */
  .scanner-page{position:relative;background:#000}
  .scanner-wrap{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:1}
  #reader{position:absolute;top:0;left:0;width:100%;height:100%;border:none!important}
  #reader video{object-fit:cover!important;width:100%!important;height:100%!important}

  .scan-overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .scan-frame{width:min(85vw,340px);height:min(35vh,220px);border:2px solid #e94560;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.6),inset 0 0 25px rgba(233,69,96,.2);position:relative}
  .scan-frame::before,.scan-frame::after{content:"";position:absolute;width:20px;height:20px;border-color:#e94560;border-style:solid}
  .scan-frame::before{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:12px 0 0 0}
  .scan-frame::after{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 12px 0}
  .scan-hint{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);margin-top:18px;font-size:.85rem;text-align:center;padding:0 24px;font-weight:500}

  .scan-btn-overlay{position:absolute;z-index:20;background:rgba(26,26,46,.85);color:#fff;border:1px solid #3a3a5a;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:.82rem;backdrop-filter:blur(6px);font-weight:500}
  .scan-btn-overlay:active{background:rgba(26,26,46,1);transform:scale(.97)}
  .btn-stop{top:14px;right:14px}
  .btn-manual{bottom:28px;left:50%;transform:translateX(-50%)}

  .fallback{position:absolute;top:0;left:0;right:0;bottom:0;background:#0f0f23;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:15;padding:24px;text-align:center}
  .fallback p{color:#888;font-size:.9rem;margin-bottom:24px;line-height:1.6;max-width:300px}
  .fb-btn{width:85%;max-width:300px;padding:15px;margin:8px 0;border:none;border-radius:12px;font-size:1rem;cursor:pointer;font-weight:600;transition:.15s}
  .fb-btn.primary{background:#e94560;color:#fff;box-shadow:0 4px 15px rgba(233,69,96,.3)}
  .fb-btn.secondary{background:#1a1a2e;color:#ccc;border:1px solid #3a3a5a}
  .fb-btn:active{transform:scale(.97)}

  .result-panel{position:absolute;top:0;left:0;right:0;bottom:0;background:#0f0f23;z-index:25;overflow-y:auto;padding:20px;padding-bottom:100px;display:none}
  .res-barcode{font-family:"SF Mono",monospace;font-size:1.3rem;color:#e94560;text-align:center;padding:14px;background:#1a1a2e;border-radius:12px;margin-bottom:14px;letter-spacing:2px;word-break:break-all;border:1px solid #2a2a4a}
  .res-status{display:inline-block;padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:700;margin-bottom:12px}
  .res-ok{background:rgba(46,204,113,.12);color:#2ecc71;border:1px solid rgba(46,204,113,.25)}
  .res-err{background:rgba(231,76,60,.12);color:#e74c3c;border:1px solid rgba(231,76,60,.25)}
  .info-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #1a1a2e;font-size:.88rem}
  .info-row:last-child{border-bottom:none}
  .info-label{color:#888;font-size:.82rem}
  .info-val{font-weight:500;text-align:right;max-width:55%;word-break:break-word;color:#e0e0e0}
  .prev-note{background:rgba(243,156,18,.08);border-left:4px solid #f39c12;padding:12px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:.84rem;color:#f0c040}
  .note-area{width:100%;min-height:80px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;padding:12px;color:#e0e0e0;font-size:.95rem;margin-top:12px;resize:vertical;font-family:inherit;line-height:1.5}
  .note-area:focus{outline:none;border-color:#e94560}
  .note-area::placeholder{color:#555}
  .btn-row{display:flex;gap:10px;margin-top:16px}
  .btn-row button{flex:1;padding:14px 4px;border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;transition:.15s}
  .btn-row button:active{transform:scale(.97)}
  .btn-ok{background:#2ecc71;color:#fff}
  .btn-warn{background:#f39c12;color:#000}
  .btn-blue{background:#3498db;color:#fff}

  /* ===== CARDS ===== */
  .card{background:#1a1a2e;border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid #2a2a4a}
  .card-title{font-size:1rem;font-weight:700;margin-bottom:4px;color:#fff}
  .card-sub{color:#777;font-size:.82rem;margin-bottom:12px}

  /* ===== UPLOAD ===== */
  .upload-zone{border:2px dashed #3a3a5a;border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:16px;background:#1a1a2e}
  .upload-zone:active{border-color:#e94560;background:#151528}
  .upload-zone .icon{font-size:2.5rem;margin-bottom:10px}
  .upload-zone .title{font-size:1rem;color:#ccc;margin-bottom:6px}
  .upload-zone .hint{color:#555;font-size:.78rem}
  .upload-zone input{display:none}
  .err-box{color:#e74c3c;font-size:.85rem;margin-bottom:12px;padding:10px 14px;background:rgba(231,76,60,.08);border-radius:8px;border:1px solid rgba(231,76,60,.15);display:none}

  /* ===== TABLE ===== */
  .table-wrap{overflow-x:auto;border-radius:10px;border:1px solid #2a2a4a;margin-top:12px;-webkit-overflow-scrolling:touch}
  .data-table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:600px}
  .data-table th{background:#1a1a2e;padding:10px;text-align:left;color:#888;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #2a2a4a;white-space:nowrap}
  .data-table td{padding:10px;border-bottom:1px solid #1a1a2e;white-space:nowrap;color:#ccc}
  .data-table td:first-child{font-family:monospace;color:#e94560;font-weight:600}
  .data-table tr:last-child td{border-bottom:none}

  /* ===== HISTORY ===== */
  .search-box{width:100%;padding:12px 16px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;color:#e0e0e0;font-size:.95rem;margin-bottom:12px}
  .search-box:focus{outline:none;border-color:#e94560}
  .hist-card{background:#1a1a2e;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;border-left:3px solid transparent;transition:.15s;border:1px solid #2a2a4a}
  .hist-card:active{transform:scale(.99);background:#151528}
  .hist-card.has-note{border-left-color:#f39c12}
  .hist-card.confirmed{border-left-color:#2ecc71}
  .hist-barcode{font-family:monospace;font-weight:700;color:#e94560;font-size:1rem}
  .hist-name{color:#ccc;font-size:.85rem;margin-top:3px}
  .hist-note{color:#f0c040;font-size:.78rem;margin-top:4px;font-style:italic}
  .hist-time{color:#555;font-size:.68rem;white-space:nowrap;margin-left:10px;margin-top:2px}
  .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.68rem;font-weight:700;margin-top:6px}
  .badge-ok{background:rgba(46,204,113,.15);color:#2ecc71}
  .badge-note{background:rgba(243,156,18,.15);color:#f39c12}

  /* ===== EXPORT ===== */
  .exp-btn{width:100%;padding:16px;margin:8px 0;border:none;border-radius:12px;font-size:1rem;cursor:pointer;font-weight:700;transition:.15s}
  .exp-btn.primary{background:#e94560;color:#fff;box-shadow:0 4px 15px rgba(233,69,96,.25)}
  .exp-btn.secondary{background:#1a1a2e;color:#ccc;border:1px solid #3a3a5a}
  .exp-btn.danger{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.25)}
  .exp-btn:active{transform:scale(.98)}

  /* ===== BOTTOM NAV ===== */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#1a1a2e;border-top:1px solid #2a2a4a;display:flex;z-index:200}
  .bottom-nav button{flex:1;background:none;border:none;color:#888;font-size:.65rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:.2s;padding:0}
  .bottom-nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .bottom-nav button.active{color:#e94560;background:rgba(233,69,96,.08);box-shadow:inset 0 2px 0 #e94560}
  .bottom-nav button:active{opacity:.7}

  /* ===== TOAST ===== */
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(120px);background:#2ecc71;color:#fff;padding:12px 24px;border-radius:10px;font-size:.9rem;z-index:3000;transition:.35s;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4);font-weight:600}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{background:#e74c3c}

  /* ===== EMPTY ===== */
  .empty{text-align:center;padding:60px 20px;color:#555}
  .empty .icon{font-size:3.5rem;margin-bottom:16px;opacity:.4}

  /* ===== MODAL ===== */
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:4000;display:none;justify-content:center;align-items:center;padding:20px}
  .modal-overlay.active{display:flex}
  .modal-box{background:#1a1a2e;border-radius:16px;padding:24px;width:100%;max-width:360px;border:1px solid #2a2a4a}
  .modal-box h3{margin-bottom:16px;color:#fff;font-size:1.1rem}
  .modal-box input{width:100%;padding:14px;background:#0f0f23;border:1px solid #2a2a4a;border-radius:10px;color:#e0e0e0;font-size:1rem;margin-bottom:16px;font-family:monospace}
  .modal-box input:focus{outline:none;border-color:#e94560}
  .modal-box .modal-btns{display:flex;gap:10px}
  .modal-box .modal-btns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer}
  .modal-box .modal-btns .btn-cancel{background:#2a2a4a;color:#ccc}
  .modal-box .modal-btns .btn-ok{background:#e94560;color:#fff}

  /* ===== DEBUG ===== */
  .debug-bar{position:fixed;top:0;left:0;right:0;background:rgba(233,69,96,.9);color:#fff;padding:6px 12px;font-size:.75rem;z-index:5000;text-align:center;font-family:monospace;display:none}
  .debug-bar.show{display:block}

  .hidden{position:absolute;opacity:0;width:0;height:0;overflow:hidden;pointer-events:none}
</style>
</head>
<body>

<div class="debug-bar" id="debugBar"></div>

<div class="app">
  <div class="app-header">
    <h1>📦 Инвентаризация</h1>
    <div class="stats">
      <span class="stat">📋 <span id="stItems">0</span></span>
      <span class="stat">✅ <span id="stScans">0</span></span>
    </div>
  </div>

  <div class="app-body">

    <!-- SCANNER -->
    <div id="pageScan" class="page active scanner-page">
      <div class="scanner-wrap" id="scanWrap">
        <div id="reader"></div>
        <div class="scan-overlay" id="scanOverlay">
          <div class="scan-frame"></div>
          <div class="scan-hint">Наведите штрихкод в рамку</div>
        </div>
        <button class="scan-btn-overlay btn-stop" id="btnStop">✕ Стоп</button>
        <button class="scan-btn-overlay btn-manual" id="btnManual">⌨️ Ввести вручную</button>
      </div>

      <div class="fallback" id="fallbackCam">
        <p id="fbText">Запуск камеры...</p>
        <button class="fb-btn primary" id="btnCapture">📷 Сфотографировать штрихкод</button>
        <button class="fb-btn secondary" id="btnManual2">⌨️ Ввести вручную</button>
        <input type="file" id="capInput" class="hidden" accept="image/*" capture="environment">
      </div>

      <div class="result-panel" id="resultPanel">
        <div class="res-barcode" id="resBarcode"></div>
        <div id="resBody"></div>
        <div class="btn-row">
          <button class="btn-ok" id="btnConfirm">✅ Подтвердить</button>
          <button class="btn-warn" id="btnNote">📝 С примечанием</button>
        </div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn-blue" id="btnResume">▶️ Сканировать дальше</button>
        </div>
      </div>
    </div>

    <!-- DATA -->
    <div id="pageData" class="page">
      <div class="page-scroll">
        <div class="upload-zone" id="uploadZone">
          <div class="icon">📂</div>
          <div class="title">Загрузить файл</div>
          <div class="hint">CSV, Excel (.xlsx, .xls), TXT</div>
        </div>
        <input type="file" id="fileInput" class="hidden" accept=".csv,.xlsx,.xls,.txt">
        <div class="err-box" id="fileErr"></div>
        <div id="dataPreview"></div>
      </div>
    </div>

    <!-- HISTORY -->
    <div id="pageHistory" class="page">
      <div class="page-scroll">
        <input type="text" class="search-box" id="histSearch" placeholder="🔍 Поиск по штрихкоду или названию...">
        <div id="histList"></div>
      </div>
    </div>

    <!-- EXPORT -->
    <div id="pageExport" class="page">
      <div class="page-scroll">
        <div class="card">
          <div class="card-title">💾 Экспорт результатов</div>
          <div class="card-sub">Скачайте CSV и откройте в Excel / Google Таблицах</div>
          <button class="exp-btn primary" id="btnExpResults">📥 Результаты сканирования</button>
          <button class="exp-btn secondary" id="btnExpFull">📥 Полный отчёт</button>
          <button class="exp-btn danger" id="btnClear">🗑️ Очистить всё</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="active" data-page="Scan" id="navScan">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    Сканер
  </button>
  <button data-page="Data" id="navData">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Данные
  </button>
  <button data-page="History" id="navHistory">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    История
  </button>
  <button data-page="Export" id="navExport">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Отчёт
  </button>
</div>

<!-- MANUAL INPUT MODAL -->
<div class="modal-overlay" id="manualModal">
  <div class="modal-box">
    <h3>Введите штрихкод</h3>
    <input type="text" id="manualInput" placeholder="4601234567890" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" id="btnManualCancel">Отмена</button>
      <button class="btn-ok" id="btnManualOk">Найти</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==================== STATE ==================== */
let DB = [], SCANS = [], scanner = null, scanning = false;
let lastCode = '', lastTime = 0;
const COOLDOWN = 1500;

function dbg(msg) {
  console.log('[INV]', msg);
  var bar = document.getElementById('debugBar');
  if (bar) { bar.textContent = msg; bar.classList.add('show'); }
}

/* ==================== INIT ==================== */
document.addEventListener('DOMContentLoaded', function() {
  dbg('Инициализация...');
  bindEvents();
  loadLS();
  updateStats();

  // Fallback visible by default, hide only on success
  document.getElementById('fallbackCam').style.display = 'flex';
  document.getElementById('scanWrap').style.display = 'none';

  if (typeof Html5Qrcode === 'undefined') {
    dbg('Html5Qrcode не загружен');
    document.getElementById('fbText').innerHTML = 'Библиотека сканера не загрузилась.<br>Проверьте интернет и обновите страницу.';
    return;
  }

  if (!window.isSecureContext) {
    dbg('Нужен HTTPS для камеры');
    document.getElementById('fbText').innerHTML = 'Камера недоступна без HTTPS.<br>Залейте файл на GitHub Pages или хостинг с HTTPS.';
    return;
  }

  dbg('Запуск камеры...');
  startScanner();
});

function bindEvents() {
  document.querySelectorAll('.bottom-nav button').forEach(function(btn) {
    btn.addEventListener('click', function() { goPage(btn.dataset.page); });
  });
  document.getElementById('btnStop').addEventListener('click', stopScan);
  document.getElementById('btnManual').addEventListener('click', openManualModal);
  document.getElementById('btnManual2').addEventListener('click', openManualModal);
  document.getElementById('btnCapture').addEventListener('click', function() { document.getElementById('capInput').click(); });
  document.getElementById('capInput').addEventListener('change', onCapture);
  document.getElementById('btnConfirm').addEventListener('click', function() { saveResult(true); });
  document.getElementById('btnNote').addEventListener('click', function() { saveResult(false); });
  document.getElementById('btnResume').addEventListener('click', resumeScan);
  document.getElementById('uploadZone').addEventListener('click', function() { document.getElementById('fileInput').click(); });
  document.getElementById('fileInput').addEventListener('change', onFile);
  document.getElementById('histSearch').addEventListener('input', renderHistory);
  document.getElementById('btnExpResults').addEventListener('click', exportResults);
  document.getElementById('btnExpFull').addEventListener('click', exportFull);
  document.getElementById('btnClear').addEventListener('click', clearAll);
  document.getElementById('btnManualCancel').addEventListener('click', closeManualModal);
  document.getElementById('btnManualOk').addEventListener('click', manualScan);
  document.getElementById('manualInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') manualScan(); });
  document.getElementById('manualModal').addEventListener('click', function(e) { if (e.target.id === 'manualModal') closeManualModal(); });
}

/* ==================== NAVIGATION ==================== */
function goPage(page) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page' + page).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(function(b) {
    b.classList.toggle('active', b.dataset.page === page);
  });
  if (page === 'History') renderHistory();
  if (page === 'Scan') resumeScan();
}

/* ==================== SCANNER ==================== */
function startScanner() {
  if (scanning) return;
  var el = document.getElementById('reader');
  el.innerHTML = '';
  scanner = new Html5Qrcode('reader');
  var cfg = { fps: 10, qrbox: { width: 260, height: 160 } };
  if (typeof Html5QrcodeSupportedFormats !== 'undefined') {
    var fmts = [];
    ['EAN_13', 'EAN_8', 'CODE_39', 'CODE_128', 'UPC_A', 'UPC_E', 'CODABAR', 'ITF'].forEach(function(f) {
      if (Html5QrcodeSupportedFormats[f]) fmts.push(Html5QrcodeSupportedFormats[f]);
    });
    if (fmts.length) cfg.formatsToSupport = fmts;
  }
  scanner.start({ facingMode: 'environment' }, cfg,
    function(txt) { onScan(txt); },
    function() {}
  ).then(function() {
    scanning = true;
    dbg('Камера запущена');
    document.getElementById('fallbackCam').style.display = 'none';
    document.getElementById('scanWrap').style.display = 'block';
    document.getElementById('scanOverlay').style.display = 'flex';
    document.getElementById('btnStop').style.display = 'block';
  }).catch(function(e) {
    console.error(e);
    dbg('Ошибка камеры: ' + e.message);
    document.getElementById('fbText').innerHTML = 'Не удалось запустить камеру.<br>Разрешите доступ к камере или используйте кнопки ниже.';
  });
}

function stopScan() {
  if (!scanner) return;
  scanner.stop().then(function() {
    scanning = false;
    scanner.clear();
    scanner = null;
    document.getElementById('scanOverlay').style.display = 'none';
    document.getElementById('btnStop').style.display = 'none';
    document.getElementById('scanWrap').style.display = 'none';
    document.getElementById('fallbackCam').style.display = 'flex';
    document.getElementById('fbText').innerHTML = 'Камера остановлена.<br>Используйте кнопки ниже.';
    dbg('Камера остановлена');
  }).catch(function() {
    scanning = false; scanner = null;
    document.getElementById('scanWrap').style.display = 'none';
    document.getElementById('fallbackCam').style.display = 'flex';
  });
}

function resumeScan() {
  document.getElementById('resultPanel').style.display = 'none';
  if (scanning) {
    document.getElementById('scanWrap').style.display = 'block';
    document.getElementById('fallbackCam').style.display = 'none';
  } else {
    document.getElementById('scanWrap').style.display = 'none';
    document.getElementById('fallbackCam').style.display = 'flex';
    if (window.isSecureContext && typeof Html5Qrcode !== 'undefined') {
      startScanner();
    }
  }
}

function onScan(code) {
  var now = Date.now();
  if (code === lastCode && now - lastTime < COOLDOWN) return;
  lastCode = code; lastTime = now;
  if (navigator.vibrate) navigator.vibrate(80);
  if (scanner && scanning) {
    scanner.stop().then(function() {
      scanning = false; scanner = null;
      showResult(code);
    }).catch(function() {
      scanning = false; scanner = null;
      showResult(code);
    });
  } else {
    showResult(code);
  }
}

/* ==================== MANUAL INPUT ==================== */
function openManualModal() {
  document.getElementById('manualModal').classList.add('active');
  setTimeout(function() { document.getElementById('manualInput').focus(); }, 100);
}
function closeManualModal() {
  document.getElementById('manualModal').classList.remove('active');
  document.getElementById('manualInput').value = '';
}
function manualScan() {
  var val = document.getElementById('manualInput').value.trim();
  if (!val) return;
  closeManualModal();
  onScan(val);
}

/* ==================== CAPTURE FALLBACK ==================== */
async function onCapture(e) {
  var f = e.target.files[0];
  if (!f) return;
  toast('🔍 Распознаю...');
  var code = null;
  if ('BarcodeDetector' in window) {
    try {
      var det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_39', 'code_128', 'upc_a', 'upc_e', 'codabar', 'itf'] });
      var bmp = await createImageBitmap(f);
      var codes = await det.detect(bmp);
      if (codes.length > 0) code = codes[0].rawValue;
    } catch (err) { console.log('BarcodeDetector err', err); }
  }
  if (!code && typeof Html5Qrcode !== 'undefined') {
    try {
      var tmpId = 'tmpScan_' + Date.now();
      var tmpDiv = document.createElement('div');
      tmpDiv.id = tmpId;
      tmpDiv.style.cssText = 'position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;';
      document.body.appendChild(tmpDiv);
      var tmp = new Html5Qrcode(tmpId);
      var res = await tmp.scanFile(f, false);
      code = res.text || res;
      await tmp.clear();
      document.body.removeChild(tmpDiv);
    } catch (err) { console.log('scanFile err', err); }
  }
  if (code) { toast('✅ Распознано'); onScan(code); }
  else { toast('❌ Не распознано. Попробуйте сфотографировать крупнее.', true); }
  e.target.value = '';
}

/* ==================== RESULT ==================== */
function showResult(code) {
  lastCode = code;
  var item = DB.find(function(r) { return String(r.Штрихкод).trim() === String(code).trim(); });
  var prev = SCANS.find(function(s) { return s.barcode === code; });
  document.getElementById('resBarcode').textContent = code;
  var h = '';
  if (item) {
    h += '<span class="res-status res-ok">✅ Найден в базе</span>';
    h += row('Название формы', item.НазваниеФормы);
    h += row('Код формы', item.КодФормы);
    h += row('Место хранения', item.МестоХранения);
    h += row('Последний статус', item.ПоследнийСтатус);
  } else {
    h += '<span class="res-status res-err">⚠️ Не найден в базе</span>';
  }
  if (prev && prev.note) {
    h += '<div class="prev-note"><b>📝 Предыдущее примечание (' + fmtTime(prev.time) + ')</b><br>' + esc(prev.note) + '</div>';
  }
  h += '<textarea class="note-area" id="noteInput" placeholder="Всё соответствует — оставьте пустым и нажмите Подтвердить. Расхождения — опишите здесь.">' + esc(prev ? prev.note : '') + '</textarea>';
  document.getElementById('resBody').innerHTML = h;
  document.getElementById('scanWrap').style.display = 'none';
  document.getElementById('fallbackCam').style.display = 'none';
  document.getElementById('resultPanel').style.display = 'block';
}

function row(l, v) { return '<div class="info-row"><span class="info-label">' + l + '</span><span class="info-val">' + esc(v) + '</span></div>'; }

function saveResult(confirmed) {
  var noteEl = document.getElementById('noteInput');
  var note = noteEl ? noteEl.value.trim() : '';
  SCANS = SCANS.filter(function(s) { return s.barcode !== lastCode; });
  var item = DB.find(function(r) { return String(r.Штрихкод).trim() === lastCode; });
  SCANS.unshift({
    barcode: lastCode, time: new Date().toISOString(),
    confirmed: confirmed && !note, note: note,
    name: item ? item.НазваниеФормы : '',
    code: item ? item.КодФормы : '',
    location: item ? item.МестоХранения : '',
    status: item ? item.ПоследнийСтатус : ''
  });
  saveLS(); updateStats();
  toast(note ? 'Примечание сохранено' : (confirmed ? 'Подтверждено' : 'Сохранено'));
  resumeScan();
}

/* ==================== FILE UPLOAD ==================== */
function onFile(e) {
  var f = e.target.files[0];
  if (!f) return;
  hideErr();
  var ext = f.name.split('.').pop().toLowerCase();
  if (ext === 'xlsx' || ext === 'xls') readXLSX(f);
  else readCSV(f);
}

function readXLSX(file) {
  if (typeof XLSX === 'undefined') { showErr('Библиотека Excel не загружена. Проверьте интернет.'); return; }
  var r = new FileReader();
  r.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, { type: 'array' });
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      if (json.length < 2) { showErr('Файл пуст'); return; }
      var hdr = json[0].map(function(h) { return String(h || '').trim(); });
      var rows = json.slice(1).map(function(row) {
        var o = {}; hdr.forEach(function(h, i) { o[h] = row[i] !== undefined ? String(row[i]).trim() : ''; }); return o;
      });
      processRows(rows);
    } catch (err) { showErr('Ошибка Excel: ' + err.message); }
  };
  r.readAsArrayBuffer(file);
}

function readCSV(file) {
  var r = new FileReader();
  r.onload = function(e) {
    var txt = e.target.result;
    if (/[Ð-ÿ]/.test(txt.slice(0, 500))) {
      var r2 = new FileReader();
      r2.onload = function(e2) { parseCSV(e2.target.result); };
      r2.readAsText(file, 'windows-1251');
    } else { parseCSV(txt); }
  };
  r.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (lines.length < 2) { showErr('CSV пуст'); return; }
  var sep = lines[0].includes('\t') ? '\t' : ',';
  var hdr = lines[0].split(sep).map(function(h) { return h.trim().replace(/^["']|["']$/g, ''); });
  var rows = lines.slice(1).map(function(line) {
    var vals = line.split(sep).map(function(v) { return v.trim().replace(/^["']|["']$/g, ''); });
    var o = {}; hdr.forEach(function(h, i) { o[h] = vals[i] || ''; }); return o;
  });
  processRows(rows);
}

function processRows(data) {
  var mapped = data.map(function(row) {
    var k = Object.keys(row);
    var find = function(vars) {
      for (var i = 0; i < vars.length; i++) {
        var v = vars[i].toLowerCase();
        var f = k.find(function(x) { return x.toLowerCase() === v; });
        if (f) return row[f];
      }
      return '';
    };
    return {
      НазваниеФормы: find(['НазваниеФормы', 'Название', 'Name', 'TITLE']),
      КодФормы: find(['КодФормы', 'Код', 'Code', 'ID']),
      Штрихкод: String(find(['Штрихкод', 'Barcode', 'EAN', 'ШК', 'BARCODE', 'EAN13']) || '').trim(),
      МестоХранения: find(['МестоХранения', 'Место', 'Location', 'PLACE']),
      ПоследнийСтатус: find(['ПоследнийСтатус', 'Статус', 'Status', 'STATE'])
    };
  }).filter(function(r) { return r.Штрихкод; });
  if (!mapped.length) { showErr('Не найдено записей с штрихкодом'); return; }
  DB = mapped; saveLS(); updateStats();
  toast('✅ Загружено ' + mapped.length + ' записей');
  renderPreview();
}

function renderPreview() {
  var c = document.getElementById('dataPreview');
  if (!DB.length) { c.innerHTML = ''; return; }
  var h = '<div class="card"><div class="card-title">📋 Загружено: ' + DB.length + ' записей</div>';
  h += '<div class="table-wrap"><table class="data-table"><thead><tr>';
  h += '<th>Штрихкод</th><th>Название</th><th>Код</th><th>Место</th><th>Статус</th>';
  h += '</tr></thead><tbody>';
  DB.slice(0, 100).forEach(function(r) {
    h += '<tr><td>' + esc(String(r.Штрихкод)) + '</td>';
    h += '<td>' + esc(r.НазваниеФормы) + '</td>';
    h += '<td>' + esc(r.КодФормы) + '</td>';
    h += '<td>' + esc(r.МестоХранения) + '</td>';
    h += '<td>' + esc(r.ПоследнийСтатус) + '</td></tr>';
  });
  if (DB.length > 100) {
    h += '<tr><td colspan="5" style="text-align:center;color:#555;padding:12px">... и ещё ' + (DB.length - 100) + ' записей</td></tr>';
  }
  h += '</tbody></table></div></div>';
  c.innerHTML = h;
}

function showErr(msg) { var el = document.getElementById('fileErr'); el.textContent = '⚠️ ' + msg; el.style.display = 'block'; }
function hideErr() { document.getElementById('fileErr').style.display = 'none'; }

/* ==================== HISTORY ==================== */
function renderHistory() {
  var q = document.getElementById('histSearch').value.toLowerCase();
  var c = document.getElementById('histList');
  var f = SCANS;
  if (q) f = SCANS.filter(function(s) { return (s.barcode + '').toLowerCase().includes(q) || (s.name + '').toLowerCase().includes(q); });
  if (!f.length) { c.innerHTML = '<div class="empty"><div class="icon">📭</div><p>История пуста</p></div>'; return; }
  c.innerHTML = f.map(function(s) {
    var cls = s.note ? 'has-note' : (s.confirmed ? 'confirmed' : '');
    var badge = s.note ? '<span class="badge badge-note">Примечание</span>' : (s.confirmed ? '<span class="badge badge-ok">Подтверждено</span>' : '');
    return '<div class="hist-card ' + cls + '" data-barcode="' + esc(s.barcode) + '">' +
      '<div><div class="hist-barcode">' + s.barcode + '</div>' +
      '<div class="hist-name">' + esc(s.name || 'Не найден в базе') + '</div>' +
      (s.note ? '<div class="hist-note">📝 ' + esc(s.note) + '</div>' : '') +
      badge + '</div>' +
      '<div class="hist-time">' + fmtTime(s.time) + '</div></div>';
  }).join('');
  c.querySelectorAll('.hist-card').forEach(function(el) {
    el.addEventListener('click', function() {
      var bc = el.getAttribute('data-barcode');
      showResult(bc);
      goPage('Scan');
    });
  });
}

/* ==================== EXPORT ==================== */
function toCSV(rows) {
  return rows.map(function(r) {
    return r.map(function(c) {
      var s = String(c || '');
      if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(',');
  }).join('\n');
}

function exportResults() {
  if (!SCANS.length) { toast('Нет данных для экспорта'); return; }
  var rows = [['Штрихкод', 'НазваниеФормы', 'КодФормы', 'МестоХранения', 'ПоследнийСтатус', 'СтатусПроверки', 'Примечание', 'Время']];
  SCANS.forEach(function(s) {
    rows.push([s.barcode, s.name, s.code, s.location, s.status, s.confirmed ? 'Подтверждено' : (s.note ? 'Примечание' : 'Проверено'), s.note || '', s.time]);
  });
  download('\uFEFF' + toCSV(rows), 'inventory_results.csv');
  toast('📥 Файл скачан');
}

function exportFull() {
  if (!DB.length && !SCANS.length) { toast('Нет данных'); return; }
  var sm = {}; SCANS.forEach(function(s) { sm[s.barcode] = s; });
  var rows = [['НазваниеФормы', 'КодФормы', 'Штрихкод', 'МестоХранения', 'ПоследнийСтатус', 'Проверено', 'СтатусПроверки', 'Примечание', 'Время']];
  DB.forEach(function(i) {
    var s = sm[i.Штрихкод];
    rows.push([i.НазваниеФормы, i.КодФормы, i.Штрихкод, i.МестоХранения, i.ПоследнийСтатус, s ? 'Да' : 'Нет', s ? (s.confirmed ? 'Подтверждено' : (s.note ? 'Примечание' : 'Проверено')) : '', s ? (s.note || '') : '', s ? s.time : '']);
  });
  SCANS.filter(function(s) { return !DB.find(function(i) { return i.Штрихкод === s.barcode; }); }).forEach(function(s) {
    rows.push(['НЕ НАЙДЕН В БАЗЕ', '', s.barcode, '', '', 'Да', s.confirmed ? 'Подтверждено' : (s.note ? 'Примечание' : 'Проверено'), s.note || '', s.time]);
  });
  download('\uFEFF' + toCSV(rows), 'inventory_full_report.csv');
  toast('📥 Отчёт скачан');
}

function download(text, name) {
  var blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

function clearAll() {
  if (!confirm('Очистить ВСЕ данные? База и история будут удалены безвозвратно.')) return;
  DB = []; SCANS = []; saveLS(); updateStats();
  document.getElementById('dataPreview').innerHTML = '';
  renderHistory();
  toast('🗑️ Все данные очищены');
}

/* ==================== STORAGE ==================== */
function saveLS() {
  try { localStorage.setItem('inv_db', JSON.stringify(DB)); localStorage.setItem('inv_sc', JSON.stringify(SCANS)); }
  catch (e) { console.warn('localStorage unavailable', e); }
}
function loadLS() {
  try { var d = localStorage.getItem('inv_db'), s = localStorage.getItem('inv_sc'); if (d) DB = JSON.parse(d); if (s) SCANS = JSON.parse(s); }
  catch (e) { console.warn('localStorage unavailable', e); }
}
function updateStats() { document.getElementById('stItems').textContent = DB.length; document.getElementById('stScans').textContent = SCANS.length; }

/* ==================== UTILS ==================== */
function esc(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function fmtTime(iso) { if (!iso) return ''; try { var d = new Date(iso); return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
function toast(msg, err) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 2500); }
</script>
