name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm install

      - name: Подготовка www
        run: |
          mkdir -p www/lib
          cp index.html www/
          cp inventory.xlsx www/
          cp -r lib/. www/lib/

      - name: Установка ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Подготовка иконки (квадрат 1024×1024)
        run: |
          mkdir -p assets
          # переносим в assets/ всё, что загрузили в корень
          [ -f icon.ico ] && mv -f icon.ico assets/icon-source.ico
          [ -f icon-source.ico ] && mv -f icon-source.ico assets/icon-source.ico
          [ -f icon.png ] && mv -f icon.png assets/icon-source.png
          [ -f icon-source.png ] && mv -f icon-source.png assets/icon-source.png

          # если файл с расширением .png на самом деле ICO (битый PNG) — переименовываем
          if [ -f assets/icon-source.png ] && ! identify assets/icon-source.png >/dev/null 2>&1; then
            echo "Файл icon-source.png на самом деле ICO — переименовываю"
            mv -f assets/icon-source.png assets/icon-source.ico
          fi

          # ICO -> PNG (берём самый крупный кадр иконки)
          if [ -f assets/icon-source.ico ]; then
            idx=$(identify -format "%w %[scene]\n" assets/icon-source.ico 2>/dev/null | sort -rn | head -n1 | awk '{print $2}')
            [ -z "$idx" ] && idx=0
            echo "Использую кадр ICO #$idx"
            convert "assets/icon-source.ico[$idx]" \
              -background "#1e3a8a" -alpha remove -alpha off \
              -resize 1024x1024 -gravity center -extent 1024x1024 assets/icon.png
          fi

          # PNG -> квадрат (если иконка пришла как png)
          if [ ! -f assets/icon.png ] && [ -f assets/icon-source.png ]; then
            convert assets/icon-source.png -trim +repage -resize 1024x1024 \
              -gravity center -background "#1e3a8a" -extent 1024x1024 assets/icon.png
          fi

          if [ -f assets/icon.png ]; then
            cp -f assets/icon.png assets/icon-only.png
            cp -f assets/icon.png assets/splash.png
            identify assets/icon.png
          else
            echo "Иконка не найдена — останется стандартная"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Добавление Android-платформы
        run: npx cap add android

      - name: Генерация иконок приложения
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android || echo "WARN: не удалось сгенерировать иконки"
          fi

      - name: Синхронизация (веб + плагины)
        run: npx cap sync android

      - name: Разрешение CAMERA в манифесте
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          sed -i '/<manifest/a\    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"

      - name: Сборка APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Публикация APK
        uses: actions/upload-artifact@v5
        with:
          name: inventory-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
