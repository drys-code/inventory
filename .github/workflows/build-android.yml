name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm install

      - name: Подготовка www
        run: |
          mkdir -p www/lib
          cp index.html www/
          cp inventory.xlsx www/
          cp -r lib/. www/lib/

      - name: Подготовка иконки (квадрат 1024×1024)
        run: |
          mkdir -p assets
          [ -f icon.png ] && mv -f icon.png assets/icon.png
          [ -f icon-source.png ] && mv -f icon-source.png assets/icon-source.png
          if [ -f assets/icon-source.png ]; then
            magick assets/icon-source.png -trim +repage -resize 1024x1024 \
              -gravity center -background "#1e3a8a" -extent 1024x1024 assets/icon.png
          fi
          if [ -f assets/icon.png ]; then
            cp -f assets/icon.png assets/icon-only.png
            cp -f assets/icon.png assets/splash.png
          else
            echo "Иконка не найдена — останется стандартная"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Добавление Android-платформы
        run: npx cap add android

      - name: Генерация иконок приложения
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android || echo "WARN: не удалось сгенерировать иконки"
          fi

      - name: Синхронизация (веб + плагины)
        run: npx cap sync android

      - name: Разрешение CAMERA в манифесте
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          sed -i '/<manifest/a\    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"

      - name: Сборка APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Публикация APK
        uses: actions/upload-artifact@v5
        with:
          name: inventory-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
