<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Инвентаризация</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* HEADER */
  .header{background:#161b22;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0}
  .header h1{font-size:1.05rem;color:#58a6ff}
  .header .stats{display:flex;gap:10px;font-size:.75rem}
  .stat{background:#21262d;padding:3px 10px;border-radius:20px;color:#8b949e}
  .stat b{color:#c9d1d9}

  /* MAIN CONTENT AREA */
  .main{flex:1;position:relative;overflow:hidden}
  .page{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
  .page.active{display:flex}

  /* SCANNER PAGE */
  .scanner-wrap{flex:1;position:relative;background:#000;overflow:hidden}
  #reader{position:absolute;inset:0;width:100%!important;height:100%!important;border:none!important}
  #reader video{object-fit:cover!important;width:100%!important;height:100%!important}
  .scan-overlay{position:absolute;inset:0;pointer-events:none;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .scan-frame{width:min(80vw,320px);height:min(30vh,200px);border:2px solid #58a6ff;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.55),inset 0 0 20px rgba(88,166,255,.25);position:relative}
  .scan-frame::before,.scan-frame::after{content:"";position:absolute;width:18px;height:18px;border-color:#58a6ff;border-style:solid}
  .scan-frame::before{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:10px 0 0 0}
  .scan-frame::after{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 10px 0}
  .scan-hint{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);margin-top:16px;font-size:.85rem;text-align:center;padding:0 20px}
  .scan-btn{position:absolute;z-index:20;background:rgba(0,0,0,.65);color:#fff;border:1px solid #484f58;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;backdrop-filter:blur(4px)}
  .scan-btn:active{background:rgba(0,0,0,.85)}
  .scan-stop{top:12px;right:12px}
  .scan-manual{bottom:24px;left:50%;transform:translateX(-50%)}

  /* Fallback for file:// */
  .fallback{position:absolute;inset:0;background:#0d1117;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:15;padding:20px;text-align:center}
  .fallback p{color:#8b949e;font-size:.9rem;margin-bottom:20px;line-height:1.5}
  .fb-btn{width:80%;max-width:280px;padding:14px;margin:8px 0;border:none;border-radius:10px;font-size:1rem;cursor:pointer}
  .fb-btn.primary{background:#238636;color:#fff}
  .fb-btn.secondary{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
  .fb-btn:active{transform:scale(.98)}

  /* RESULT PANEL */
  .result-panel{position:absolute;inset:0;background:#0d1117;z-index:25;overflow-y:auto;padding:16px;padding-bottom:100px;display:none}
  .barcode-big{font-family:"SF Mono",monospace;font-size:1.4rem;color:#58a6ff;text-align:center;padding:12px;background:#161b22;border-radius:10px;margin-bottom:12px;letter-spacing:2px;word-break:break-all}
  .status-chip{display:inline-block;padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:700;margin-bottom:10px}
  .st-ok{background:#23863622;color:#3fb950;border:1px solid #23863644}
  .st-err{background:#da363322;color:#f85149;border:1px solid #da363344}
  .info-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #21262d;font-size:.88rem}
  .info-row:last-child{border-bottom:none}
  .info-label{color:#8b949e}
  .info-val{font-weight:500;text-align:right;max-width:55%;word-break:break-word}
  .prev-note{background:#341a00;border-left:4px solid #d29922;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:.84rem;color:#e3b341}
  .note-area{width:100%;min-height:70px;background:#21262d;border:1px solid #30363d;border-radius:8px;padding:10px;color:#c9d1d9;font-size:.95rem;margin-top:10px;resize:vertical;font-family:inherit}
  .note-area:focus{outline:none;border-color:#58a6ff}
  .btn-row{display:flex;gap:8px;margin-top:12px}
  .btn-row button{flex:1;padding:13px 4px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer}
  .btn-green{background:#238636;color:#fff}
  .btn-yellow{background:#d29922;color:#000}
  .btn-blue{background:#1f6feb;color:#fff}
  .btn-gray{background:#21262d;color:#c9d1d9;border:1px solid #30363d}

  /* DATA PAGE */
  .scrollable{flex:1;overflow-y:auto;padding:16px}
  .upload-box{border:2px dashed #30363d;border-radius:12px;padding:35px 20px;text-align:center;margin-bottom:16px;cursor:pointer;transition:.2s}
  .upload-box:active{border-color:#58a6ff;background:#161b22}
  .upload-box input{display:none}
  .file-hint{color:#484f58;font-size:.75rem;margin-top:6px}
  .err-msg{color:#f85149;font-size:.82rem;margin-bottom:10px;padding:8px 12px;background:#da363311;border-radius:6px;display:none}
  .preview-table{width:100%;border-collapse:collapse;font-size:.78rem}
  .preview-table th{background:#161b22;padding:7px;text-align:left;color:#8b949e;font-weight:600;position:sticky;top:0}
  .preview-table td{padding:7px;border-bottom:1px solid #21262d}
  .preview-table td:first-child{font-family:monospace;color:#58a6ff}

  /* HISTORY */
  .hist-item{background:#161b22;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;border-left:3px solid transparent}
  .hist-item.has-note{border-left-color:#d29922}
  .hist-item.confirmed{border-left-color:#238636}
  .hist-barcode{font-family:monospace;font-weight:700;color:#58a6ff;font-size:.95rem}
  .hist-note{color:#e3b341;font-size:.78rem;margin-top:3px;font-style:italic}
  .hist-time{color:#484f58;font-size:.68rem;white-space:nowrap;margin-left:8px}
  .search-input{width:100%;padding:10px 14px;background:#21262d;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:.95rem;margin-bottom:10px}
  .search-input:focus{outline:none;border-color:#58a6ff}

  /* EXPORT */
  .exp-btn{width:100%;padding:14px;margin:6px 0;border:none;border-radius:10px;font-size:1rem;cursor:pointer}
  .exp-btn.primary{background:#238636;color:#fff}
  .exp-btn.secondary{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
  .exp-btn.danger{background:#da3633;color:#fff}
  .exp-btn:active{transform:scale(.99)}

  /* NAV */
  .nav{display:flex;background:#161b22;border-top:1px solid #30363d;flex-shrink:0}
  .nav-btn{flex:1;padding:10px 2px;text-align:center;font-size:.7rem;color:#8b949e;background:none;border:none;cursor:pointer;border-top:3px solid transparent;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:3px}
  .nav-btn.active{color:#58a6ff;border-top-color:#58a6ff;background:#0d1117}
  .nav-btn svg{width:20px;height:20px}

  /* TOAST */
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(120px);background:#238636;color:#fff;padding:10px 20px;border-radius:8px;font-size:.88rem;z-index:2000;transition:.3s;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{background:#da3633}

  .hidden{position:absolute;opacity:0;width:0;height:0;overflow:hidden}
</style>
</head>
<body>

<div class="header">
  <h1>📦 Инвентаризация</h1>
  <div class="stats">
    <span class="stat">📋 <b id="stItems">0</b></span>
    <span class="stat">✅ <b id="stScans">0</b></span>
  </div>
</div>

<div class="main">

  <!-- SCANNER -->
  <div id="pScan" class="page active">
    <div class="scanner-wrap" id="scanWrap">
      <div id="reader"></div>
      <div class="scan-overlay" id="scanOverlay">
        <div class="scan-frame"></div>
        <div class="scan-hint">Наведите штрихкод в рамку</div>
      </div>
      <button class="scan-btn scan-stop" id="btnStop">✕ Стоп</button>
      <button class="scan-btn scan-manual" id="btnManual">⌨️ Вручную</button>
    </div>

    <div class="fallback" id="fallbackCam">
      <p id="fbText">Камера недоступна.<br>Используйте нативную камеру телефона.</p>
      <button class="fb-btn primary" id="btnCapture">📷 Сфотографировать штрихкод</button>
      <button class="fb-btn secondary" id="btnManual2">⌨️ Ввести вручную</button>
      <input type="file" id="capInput" class="hidden" accept="image/*" capture="environment">
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="barcode-big" id="resBarcode"></div>
      <div id="resBody"></div>
      <div class="btn-row">
        <button class="btn-green" id="btnConfirm">✅ Подтвердить</button>
        <button class="btn-yellow" id="btnNote">📝 С примечанием</button>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn-blue" id="btnResume">▶️ Сканировать дальше</button>
      </div>
    </div>
  </div>

  <!-- DATA -->
  <div id="pData" class="page">
    <div class="scrollable">
      <div class="upload-box" id="uploadBox">
        <div style="font-size:2rem;margin-bottom:6px">📂</div>
        <div style="font-size:.95rem">Нажмите для загрузки файла</div>
        <div class="file-hint">.xlsx, .xls, .csv, .txt</div>
      </div>
      <input type="file" id="fileInput" class="hidden" accept=".csv,.xlsx,.xls,.txt">
      <div class="err-msg" id="fileErr"></div>
      <div id="dataPreview"></div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="pHist" class="page">
    <div class="scrollable">
      <input type="text" class="search-input" id="histSearch" placeholder="🔍 Поиск по штрихкоду или названию...">
      <div id="histList"></div>
    </div>
  </div>

  <!-- EXPORT -->
  <div id="pExp" class="page">
    <div class="scrollable" style="display:flex;flex-direction:column;gap:10px">
      <h2 style="font-size:1.05rem">💾 Экспорт</h2>
      <p style="color:#8b949e;font-size:.82rem">Скачайте CSV и откройте в Excel / Google Таблицах</p>
      <button class="exp-btn primary" id="btnExpResults">📥 Результаты сканирования</button>
      <button class="exp-btn secondary" id="btnExpFull">📥 Полный отчёт</button>
      <button class="exp-btn danger" id="btnClear">🗑️ Очистить всё</button>
    </div>
  </div>

</div>

<div class="nav">
  <button class="nav-btn active" data-tab="Scan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    Сканер
  </button>
  <button class="nav-btn" data-tab="Data">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Данные
  </button>
  <button class="nav-btn" data-tab="Hist">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    История
  </button>
  <button class="nav-btn" data-tab="Exp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Отчёт
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==================== STATE ==================== */
let DB=[], SCANS=[], scanner=null, scanning=false, lastCode='', lastTime=0;
const COOLDOWN=1500;

/* ==================== INIT ==================== */
document.addEventListener('DOMContentLoaded', function(){
  bindEvents();
  loadLS();
  updateStats();
  if(window.isSecureContext && typeof Html5Qrcode !== 'undefined'){
    startScanner();
  } else {
    showFallback();
  }
});

function bindEvents(){
  // Nav
  document.querySelectorAll('.nav-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ goTab(btn.dataset.tab); });
  });
  // Scanner
  document.getElementById('btnStop').addEventListener('click', stopScan);
  document.getElementById('btnManual').addEventListener('click', manualInput);
  document.getElementById('btnManual2').addEventListener('click', manualInput);
  document.getElementById('btnCapture').addEventListener('click', function(){ document.getElementById('capInput').click(); });
  document.getElementById('capInput').addEventListener('change', onCapture);
  document.getElementById('btnConfirm').addEventListener('click', function(){ saveResult(true); });
  document.getElementById('btnNote').addEventListener('click', function(){ saveResult(false); });
  document.getElementById('btnResume').addEventListener('click', resumeScan);
  // Data
  document.getElementById('uploadBox').addEventListener('click', function(){ document.getElementById('fileInput').click(); });
  document.getElementById('fileInput').addEventListener('change', onFile);
  // History
  document.getElementById('histSearch').addEventListener('input', renderHist);
  // Export
  document.getElementById('btnExpResults').addEventListener('click', exportResults);
  document.getElementById('btnExpFull').addEventListener('click', exportFull);
  document.getElementById('btnClear').addEventListener('click', clearAll);
}

function showFallback(){
  document.getElementById('scanWrap').style.display='none';
  document.getElementById('fallbackCam').style.display='flex';
  if(!window.isSecureContext){
    document.getElementById('fbText').innerHTML='Камера в браузере недоступна для локальных файлов.<br>Используйте кнопки ниже.';
  } else if(typeof Html5Qrcode === 'undefined'){
    document.getElementById('fbText').innerHTML='Библиотека сканера не загрузилась.<br>Проверьте подключение к интернету и обновите страницу.';
  }
}

/* ==================== SCANNER ==================== */
function startScanner(){
  if(scanning) return;
  var el=document.getElementById('reader');
  el.innerHTML='';
  scanner=new Html5Qrcode('reader');
  var cfg={fps:10, qrbox:{width:260, height:160}};
  var fmts=[];
  if(typeof Html5QrcodeSupportedFormats !== 'undefined'){
    ['EAN_13','EAN_8','CODE_39','CODE_128','UPC_A','UPC_E'].forEach(function(f){
      if(Html5QrcodeSupportedFormats[f]) fmts.push(Html5QrcodeSupportedFormats[f]);
    });
    if(fmts.length) cfg.formatsToSupport=fmts;
  }
  scanner.start({facingMode:'environment'}, cfg,
    function(txt){ onScan(txt); },
    function(){}
  ).then(function(){
    scanning=true;
    document.getElementById('scanOverlay').style.display='flex';
    document.getElementById('btnStop').style.display='block';
  }).catch(function(e){
    console.error(e);
    showFallback();
  });
}

function stopScan(){
  if(!scanner) return;
  scanner.stop().then(function(){
    scanning=false;
    scanner.clear();
    scanner=null;
    document.getElementById('scanOverlay').style.display='none';
    document.getElementById('btnStop').style.display='none';
    showFallback();
  }).catch(function(){
    scanning=false; scanner=null;
    showFallback();
  });
}

function resumeScan(){
  document.getElementById('resultPanel').style.display='none';
  document.getElementById('scanWrap').style.display='block';
  if(window.isSecureContext && typeof Html5Qrcode !== 'undefined'){
    startScanner();
  } else {
    showFallback();
  }
}

function onScan(code){
  var now=Date.now();
  if(code===lastCode && now-lastTime<COOLDOWN) return;
  lastCode=code; lastTime=now;
  if(navigator.vibrate) navigator.vibrate(80);
  if(scanner && scanning){
    scanner.stop().then(function(){
      scanning=false; scanner=null;
      showResult(code);
    }).catch(function(){
      scanning=false; scanner=null;
      showResult(code);
    });
  } else {
    showResult(code);
  }
}

/* ==================== CAPTURE FALLBACK ==================== */
async function onCapture(e){
  var f=e.target.files[0];
  if(!f) return;
  toast('🔍 Распознаю...');
  var code=null;

  if('BarcodeDetector' in window){
    try{
      var det=new BarcodeDetector({formats:['ean_13','ean_8','code_39','code_128','upc_a','upc_e']});
      var bmp=await createImageBitmap(f);
      var codes=await det.detect(bmp);
      if(codes.length>0) code=codes[0].rawValue;
    }catch(err){ console.log('BarcodeDetector err',err); }
  }

  if(!code && typeof Html5Qrcode !== 'undefined'){
    try{
      var tmpId='tmpScan_'+Date.now();
      var tmpDiv=document.createElement('div');
      tmpDiv.id=tmpId;
      tmpDiv.style.cssText='position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;';
      document.body.appendChild(tmpDiv);
      var tmp=new Html5Qrcode(tmpId);
      var res=await tmp.scanFile(f,false);
      code=res.text || res;
      await tmp.clear();
      document.body.removeChild(tmpDiv);
    }catch(err){ console.log('scanFile err',err); }
  }

  if(code){
    toast('✅ Распознано');
    onScan(code);
  } else {
    toast('❌ Не распознано. Попробуйте сфотографировать крупнее.',true);
  }
  e.target.value='';
}

function manualInput(){
  var c=prompt('Введите штрихкод:');
  if(c && c.trim()) onScan(c.trim());
}

/* ==================== RESULT ==================== */
function showResult(code){
  lastCode = code;
  var item=DB.find(function(r){ return String(r.Штрихкод).trim()===String(code).trim(); });
  var prev=SCANS.find(function(s){ return s.barcode===code; });
  document.getElementById('resBarcode').textContent=code;
  var h='';
  if(item){
    h+='<span class="status-chip st-ok">✅ Найден в базе</span>';
    h+=row('Название формы', item.НазваниеФормы);
    h+=row('Код формы', item.КодФормы);
    h+=row('Место хранения', item.МестоХранения);
    h+=row('Последний статус', item.ПоследнийСтатус);
  } else {
    h+='<span class="status-chip st-err">⚠️ Не найден в базе</span>';
  }
  if(prev && prev.note){
    h+='<div class="prev-note"><b>📝 Предыдущее примечание ('+fmtTime(prev.time)+')</b><br>'+esc(prev.note)+'</div>';
  }
  h+='<textarea class="note-area" id="noteInput" placeholder="Всё соответствует — оставьте пустым и нажмите Подтвердить. Расхождения — опишите здесь.">'+esc(prev?prev.note:'')+'</textarea>';
  document.getElementById('resBody').innerHTML=h;
  document.getElementById('scanWrap').style.display='none';
  document.getElementById('fallbackCam').style.display='none';
  document.getElementById('resultPanel').style.display='block';
}

function row(l,v){ return '<div class="info-row"><span class="info-label">'+l+'</span><span class="info-val">'+esc(v)+'</span></div>'; }

function saveResult(confirmed){
  var note=document.getElementById('noteInput') ? document.getElementById('noteInput').value.trim() : '';
  SCANS=SCANS.filter(function(s){ return s.barcode!==lastCode; });
  var item=DB.find(function(r){ return String(r.Штрихкод).trim()===lastCode; });
  SCANS.unshift({
    barcode:lastCode, time:new Date().toISOString(),
    confirmed: confirmed && !note, note: note,
    name: item?item.НазваниеФормы:'',
    code: item?item.КодФормы:'',
    location: item?item.МестоХранения:'',
    status: item?item.ПоследнийСтатус:''
  });
  saveLS(); updateStats();
  toast(note?'Примечание сохранено':(confirmed?'Подтверждено':'Сохранено'));
  resumeScan();
}

/* ==================== FILE UPLOAD ==================== */
function onFile(e){
  var f=e.target.files[0];
  if(!f) return;
  document.getElementById('fileErr').style.display='none';
  var ext=f.name.split('.').pop().toLowerCase();
  if(ext==='xlsx' || ext==='xls') readXLSX(f);
  else readCSV(f);
}

function readXLSX(file){
  if(typeof XLSX === 'undefined'){ fileErr('Библиотека Excel не загружена. Подключите интернет.'); return; }
  var r=new FileReader();
  r.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'});
      var sheet=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(sheet,{header:1});
      if(json.length<2){ fileErr('Файл пуст'); return; }
      var hdr=json[0].map(function(h){ return String(h).trim(); });
      var rows=json.slice(1).map(function(row){
        var o={}; hdr.forEach(function(h,i){ o[h]=row[i]!==undefined?String(row[i]).trim():''; }); return o;
      });
      processRows(rows);
    }catch(err){ fileErr('Ошибка Excel: '+err.message); }
  };
  r.readAsArrayBuffer(file);
}

function readCSV(file){
  var r=new FileReader();
  r.onload=function(e){
    var txt=e.target.result;
    if(/[Ð-ÿ]/.test(txt.slice(0,500))){
      var r2=new FileReader();
      r2.onload=function(e2){ parseCSV(e2.target.result); };
      r2.readAsText(file,'windows-1251');
    } else { parseCSV(txt); }
  };
  r.readAsText(file,'UTF-8');
}

function parseCSV(text){
  var lines=text.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if(lines.length<2){ fileErr('CSV пуст'); return; }
  var sep=lines[0].includes('\t')?'\t':',';
  var hdr=lines[0].split(sep).map(function(h){ return h.trim().replace(/^["']|["']$/g,''); });
  var rows=lines.slice(1).map(function(line){
    var vals=line.split(sep).map(function(v){ return v.trim().replace(/^["']|["']$/g,''); });
    var o={}; hdr.forEach(function(h,i){ o[h]=vals[i]||''; }); return o;
  });
  processRows(rows);
}

function processRows(data){
  var mapped=data.map(function(row){
    var k=Object.keys(row);
    var find=function(vars){ for(var i=0;i<vars.length;i++){ var v=vars[i]; var f=k.find(function(x){return x.toLowerCase()===v.toLowerCase();}); if(f) return row[f]; } return ''; };
    return {
      НазваниеФормы: find(['НазваниеФормы','Название','Name']),
      КодФормы: find(['КодФормы','Код','Code']),
      Штрихкод: String(find(['Штрихкод','Barcode','EAN','ШК'])||'').trim(),
      МестоХранения: find(['МестоХранения','Место','Location']),
      ПоследнийСтатус: find(['ПоследнийСтатус','Статус','Status'])
    };
  }).filter(function(r){ return r.Штрихкод; });
  if(!mapped.length){ fileErr('Не найдено записей с штрихкодом'); return; }
  DB=mapped; saveLS(); updateStats();
  toast('✅ Загружено '+mapped.length+' записей');
  renderPreview();
}

function renderPreview(){
  var c=document.getElementById('dataPreview');
  var h='<h3 style="margin-bottom:10px;font-size:.95rem">📋 '+DB.length+' записей</h3>';
  h+='<div style="overflow:auto;border-radius:8px;border:1px solid #21262d"><table class="preview-table"><thead><tr><th>Штрихкод</th><th>Название</th><th>Место</th></tr></thead><tbody>';
  DB.slice(0,50).forEach(function(r){
    h+='<tr><td>'+esc(String(r.Штрихкод))+'</td><td>'+esc(r.НазваниеФормы)+'</td><td>'+esc(r.МестоХранения)+'</td></tr>';
  });
  if(DB.length>50) h+='<tr><td colspan="3" style="text-align:center;color:#484f58">... и ещё '+(DB.length-50)+'</td></tr>';
  h+='</tbody></table></div>';
  c.innerHTML=h;
}

function fileErr(msg){ var el=document.getElementById('fileErr'); el.textContent='⚠️ '+msg; el.style.display='block'; }

/* ==================== HISTORY ==================== */
function renderHist(){
  var q=document.getElementById('histSearch').value.toLowerCase();
  var c=document.getElementById('histList');
  var f=SCANS;
  if(q) f=SCANS.filter(function(s){ return (s.barcode+'').toLowerCase().includes(q) || (s.name+'').toLowerCase().includes(q); });
  if(!f.length){ c.innerHTML='<div style="text-align:center;color:#484f58;padding:40px">История пуста</div>'; return; }
  c.innerHTML=f.map(function(s){
    var cls=s.note?'has-note':(s.confirmed?'confirmed':'');
    return '<div class="hist-item '+cls+'" data-barcode="'+esc(s.barcode)+'">'+
      '<div><div class="hist-barcode">'+s.barcode+'</div><div style="color:#c9d1d9;font-size:.82rem">'+esc(s.name||'Не найден')+'</div>'+(s.note?'<div class="hist-note">📝 '+esc(s.note)+'</div>':'')+'</div>'+
      '<div class="hist-time">'+fmtTime(s.time)+'</div></div>';
  }).join('');
  c.querySelectorAll('.hist-item').forEach(function(el){
    el.addEventListener('click', function(){
      var bc = el.getAttribute('data-barcode');
      showResult(bc);
      goTab('Scan');
    });
  });
}

/* ==================== EXPORT ==================== */
function toCSV(rows){
  return rows.map(function(r){ return r.map(function(c){ var s=String(c||''); if(s.indexOf(',')>=0 || s.indexOf('"')>=0 || s.indexOf('\n')>=0) return '"'+s.replace(/"/g,'""')+'"'; return s; }).join(','); }).join('\n');
}

function exportResults(){
  if(!SCANS.length){ toast('Нет данных'); return; }
  var rows=[['Штрихкод','НазваниеФормы','КодФормы','МестоХранения','ПоследнийСтатус','СтатусПроверки','Примечание','Время']];
  SCANS.forEach(function(s){ rows.push([s.barcode,s.name,s.code,s.location,s.status,s.confirmed?'Подтверждено':(s.note?'Примечание':'Проверено'),s.note||'',s.time]); });
  download('\uFEFF'+toCSV(rows),'inventory_results.csv');
  toast('📥 Скачан');
}

function exportFull(){
  var sm={}; SCANS.forEach(function(s){ sm[s.barcode]=s; });
  var rows=[['НазваниеФормы','КодФормы','Штрихкод','МестоХранения','ПоследнийСтатус','Проверено','СтатусПроверки','Примечание','Время']];
  DB.forEach(function(i){
    var s=sm[i.Штрихкод];
    rows.push([i.НазваниеФормы,i.КодФормы,i.Штрихкод,i.МестоХранения,i.ПоследнийСтатус,s?'Да':'Нет',s?(s.confirmed?'Подтверждено':(s.note?'Примечание':'Проверено')):'',s?(s.note||''):'',s?s.time:'']);
  });
  SCANS.filter(function(s){ return !DB.find(function(i){ return i.Штрихкод===s.barcode; }); }).forEach(function(s){
    rows.push(['НЕ НАЙДЕН В БАЗЕ','',s.barcode,'','','Да',s.confirmed?'Подтверждено':(s.note?'Примечание':'Проверено'),s.note||'',s.time]);
  });
  download('\uFEFF'+toCSV(rows),'inventory_full.csv');
  toast('📥 Отчёт скачан');
}

function download(text,name){
  var blob=new Blob([text],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
}

function clearAll(){
  if(!confirm('Очистить ВСЁ?')) return;
  DB=[]; SCANS=[]; saveLS(); updateStats();
  document.getElementById('dataPreview').innerHTML='';
  renderHist();
  toast('Очищено');
}

/* ==================== TABS ==================== */
function goTab(tab){
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('p'+tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab); });
  if(tab==='Hist') renderHist();
  if(tab==='Scan') resumeScan();
}

/* ==================== STORAGE ==================== */
function saveLS(){ 
  try {
    localStorage.setItem('inv_db',JSON.stringify(DB)); 
    localStorage.setItem('inv_sc',JSON.stringify(SCANS)); 
  } catch(e) { console.warn('localStorage unavailable', e); }
}
function loadLS(){ 
  try{ 
    var d=localStorage.getItem('inv_db'), s=localStorage.getItem('inv_sc'); 
    if(d) DB=JSON.parse(d); 
    if(s) SCANS=JSON.parse(s); 
  }catch(e){ console.warn('localStorage unavailable', e); } 
}
function updateStats(){ document.getElementById('stItems').textContent=DB.length; document.getElementById('stScans').textContent=SCANS.length; }

/* ==================== UTILS ==================== */
function esc(t){ if(!t) return ''; var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function fmtTime(iso){ if(!iso) return ''; try{ var d=new Date(iso); return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function toast(msg,err){ var t=document.getElementById('toast'); t.textContent=msg; t.className='toast'+(err?' err':''); t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },2500); }
</script></body>
