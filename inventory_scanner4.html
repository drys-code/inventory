<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Инвентаризация — Тест</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;overflow:hidden}
  .page{display:none;height:100vh;flex-direction:column}
  .page.active{display:flex}

  /* HEADER */
  .header{background:#161b22;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;z-index:100}
  .header h1{font-size:1.1rem;color:#58a6ff}
  .header .stats{display:flex;gap:12px;font-size:.8rem}
  .stat{background:#21262d;padding:4px 10px;border-radius:20px;color:#8b949e}
  .stat b{color:#c9d1d9}

  /* NAV */
  .nav{display:flex;background:#161b22;border-top:1px solid #30363d}
  .nav-btn{flex:1;padding:14px 4px;text-align:center;font-size:.75rem;color:#8b949e;background:none;border:none;cursor:pointer;border-top:3px solid transparent;transition:.2s}
  .nav-btn.active{color:#58a6ff;border-top-color:#58a6ff;background:#0d1117}
  .nav-btn svg{width:22px;height:22px;margin-bottom:4px}

  /* SCANNER FULLSCREEN */
  #scannerPage{position:relative}
  #reader{position:absolute;top:0;left:0;width:100%!important;height:100%!important;border:none!important;background:#000}
  #reader video{object-fit:cover!important;width:100%!important;height:100%!important}
  .scan-overlay{position:absolute;inset:0;pointer-events:none;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .scan-frame{width:280px;height:180px;border:2px solid #58a6ff;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.6),inset 0 0 20px rgba(88,166,255,.3);position:relative}
  .scan-frame::before,.scan-frame::after{content:"";position:absolute;width:20px;height:20px;border-color:#58a6ff;border-style:solid}
  .scan-frame::before{top:-2px;left:-2px;border-width:4px 0 0 4px;border-radius:12px 0 0 0}
  .scan-frame::after{bottom:-2px;right:-2px;border-width:0 4px 4px 0;border-radius:0 0 12px 0}
  .scan-hint{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);margin-top:20px;font-size:.9rem;text-align:center;padding:0 20px}
  .scan-stop{position:absolute;top:16px;right:16px;z-index:20;background:rgba(0,0,0,.6);color:#fff;border:1px solid #30363d;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:.85rem}
  .scan-stop:active{background:rgba(0,0,0,.8)}

  /* FALLBACK CAMERA */
  .fallback-cam{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:5}
  .fallback-cam .btn-cam{background:#238636;color:#fff;border:none;padding:16px 32px;border-radius:12px;font-size:1.1rem;cursor:pointer;margin:10px;width:80%;max-width:300px}
  .fallback-cam .btn-cam:active{transform:scale(.98)}
  .fallback-cam p{color:#8b949e;text-align:center;padding:0 30px;margin-bottom:20px;font-size:.9rem}

  /* RESULT OVERLAY */
  .result-overlay{position:absolute;inset:0;background:#0d1117;z-index:30;overflow-y:auto;padding:16px;padding-bottom:100px}
  .barcode-big{font-family:"SF Mono",monospace;font-size:1.6rem;color:#58a6ff;text-align:center;padding:14px;background:#161b22;border-radius:10px;margin-bottom:14px;letter-spacing:2px}
  .status-chip{display:inline-block;padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:700;margin-bottom:12px}
  .st-ok{background:#23863622;color:#3fb950}
  .st-err{background:#da363322;color:#f85149}
  .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #21262d;font-size:.9rem}
  .info-row:last-child{border-bottom:none}
  .info-label{color:#8b949e}
  .info-val{font-weight:500;text-align:right;max-width:60%}
  .prev-note{background:#341a00;border-left:4px solid #d29922;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:.85rem;color:#e3b341}
  .note-area{width:100%;min-height:80px;background:#21262d;border:1px solid #30363d;border-radius:8px;padding:12px;color:#c9d1d9;font-size:1rem;margin-top:10px;resize:vertical}
  .note-area:focus{outline:none;border-color:#58a6ff}
  .btn-row{display:flex;gap:10px;margin-top:14px}
  .btn-row button{flex:1;padding:14px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
  .btn-green{background:#238636;color:#fff}
  .btn-yellow{background:#d29922;color:#000}
  .btn-blue{background:#1f6feb;color:#fff}
  .btn-gray{background:#21262d;color:#c9d1d9;border:1px solid #30363d}

  /* DATA PAGE */
  .upload-box{border:2px dashed #30363d;border-radius:12px;padding:40px 20px;text-align:center;margin:16px;cursor:pointer;transition:.2s}
  .upload-box:active{border-color:#58a6ff;background:#161b22}
  .upload-box input{display:none}
  .file-hint{color:#8b949e;font-size:.8rem;margin-top:8px}
  .preview-table{width:100%;border-collapse:collapse;font-size:.8rem;margin:0 16px;width:calc(100% - 32px)}
  .preview-table th{background:#161b22;padding:8px;text-align:left;color:#8b949e;font-weight:600}
  .preview-table td{padding:8px;border-bottom:1px solid #21262d}
  .preview-table td:first-child{font-family:monospace;color:#58a6ff}

  /* HISTORY */
  .hist-item{background:#161b22;border-radius:10px;padding:12px;margin:6px 16px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;border-left:3px solid transparent}
  .hist-item.has-note{border-left-color:#d29922}
  .hist-item.confirmed{border-left-color:#238636}
  .hist-barcode{font-family:monospace;font-weight:700;color:#58a6ff;font-size:1rem}
  .hist-note{color:#e3b341;font-size:.8rem;margin-top:4px;font-style:italic}
  .hist-time{color:#484f58;font-size:.7rem;white-space:nowrap;margin-left:8px}

  /* TOAST */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#238636;color:#fff;padding:12px 24px;border-radius:8px;font-size:.9rem;z-index:1000;transition:.3s;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{background:#da3633}

  /* HIDDEN */
  .hidden{position:absolute;opacity:0;width:0;height:0;overflow:hidden}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1>📦 Инвентаризация</h1>
  <div class="stats">
    <span class="stat">📋 <b id="stItems">0</b></span>
    <span class="stat">✅ <b id="stScans">0</b></span>
  </div>
</div>

<!-- PAGES -->
<div id="pScan" class="page active" style="position:relative">
  <div id="reader"></div>
  <div class="scan-overlay" id="scanOverlay">
    <div class="scan-frame"></div>
    <div class="scan-hint">Наведите штрихкод в рамку</div>
  </div>
  <button class="scan-stop" onclick="stopScan()" id="btnStop">✕ Закрыть камеру</button>

  <!-- Fallback for file:// -->
  <div class="fallback-cam" id="fallbackCam" style="display:none">
    <p id="fbText">Камера в браузере недоступна для локальных файлов.<br>Используйте нативную камеру телефона.</p>
    <button class="btn-cam" onclick="document.getElementById('capInput').click()">📷 Сфотографировать штрихкод</button>
    <button class="btn-cam btn-gray" onclick="manualInput()">⌨️ Ввести вручную</button>
    <input type="file" id="capInput" class="hidden" accept="image/*" capture="environment" onchange="onCapture(event)">
  </div>

  <!-- Result -->
  <div class="result-overlay" id="resultOverlay" style="display:none">
    <div class="barcode-big" id="resBarcode"></div>
    <div id="resBody"></div>
    <div class="btn-row">
      <button class="btn-green" onclick="saveScan(true)">✅ Подтвердить</button>
      <button class="btn-yellow" onclick="saveScan(false)">📝 С примечанием</button>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn-blue" onclick="resumeScan()" id="btnResume">▶️ Сканировать дальше</button>
    </div>
  </div>
</div>

<div id="pData" class="page">
  <div style="padding:16px;overflow-y:auto;height:100%">
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <div style="font-size:2rem;margin-bottom:8px">📂</div>
      <div style="font-size:1rem">Нажмите для загрузки файла</div>
      <div class="file-hint">Поддерживаются: .xlsx, .xls, .csv, .txt</div>
    </div>
    <input type="file" id="fileInput" class="hidden" accept=".csv,.xlsx,.xls,.txt" onchange="onFile(event)">
    <div id="fileStatus" style="color:#f85149;font-size:.85rem;margin:0 16px 10px;display:none"></div>
    <div id="dataPreview"></div>
  </div>
</div>

<div id="pHist" class="page">
  <div style="padding:12px 16px">
    <input type="text" id="histSearch" placeholder="🔍 Поиск..." oninput="renderHist()" style="width:100%;padding:10px 14px;background:#21262d;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:1rem">
  </div>
  <div id="histList" style="overflow-y:auto;flex:1;padding-bottom:20px"></div>
</div>

<div id="pExp" class="page">
  <div style="padding:16px;display:flex;flex-direction:column;gap:12px;height:100%;overflow-y:auto">
    <h2 style="font-size:1.1rem">💾 Экспорт</h2>
    <p style="color:#8b949e;font-size:.85rem">Скачайте CSV и откройте в Excel / Google Таблицах</p>
    <button class="btn-cam" onclick="exportResults()">📥 Результаты сканирования</button>
    <button class="btn-cam btn-gray" onclick="exportFull()">📥 Полный отчёт</button>
    <button class="btn-cam" style="background:#da3633" onclick="clearAll()">🗑️ Очистить всё</button>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <button class="nav-btn active" onclick="goTab(0)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><br>Сканер
  </button>
  <button class="nav-btn" onclick="goTab(1)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><br>Данные
  </button>
  <button class="nav-btn" onclick="goTab(2)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><br>История
  </button>
  <button class="nav-btn" onclick="goTab(3)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><br>Отчёт
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== STATE ====================
let DB=[], SCANS=[], scanner=null, scanning=false, lastCode='', lastTime=0;
const COOLDOWN=1500;

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded',()=>{
  loadLS();
  updateStats();
  if(window.isSecureContext){
    startScanner();
  } else {
    document.getElementById('reader').style.display='none';
    document.getElementById('scanOverlay').style.display='none';
    document.getElementById('btnStop').style.display='none';
    document.getElementById('fallbackCam').style.display='flex';
  }
});

// ==================== SCANNER ====================
function startScanner(){
  if(typeof Html5Qrcode==='undefined'){toast('Библиотека не загружена. Проверьте интернет.');return;}
  if(scanning)return;
  const el=document.getElementById('reader');
  el.style.display='block';
  document.getElementById('scanOverlay').style.display='flex';
  document.getElementById('btnStop').style.display='block';
  document.getElementById('fallbackCam').style.display='none';
  document.getElementById('resultOverlay').style.display='none';

  scanner=new Html5Qrcode('reader');
  const cfg={fps:10,qrbox:{width:260,height:160}};
  const fmts=[];
  if(typeof Html5QrcodeSupportedFormats!=='undefined'){
    ['EAN_13','EAN_8','CODE_39','CODE_128','UPC_A','UPC_E'].forEach(f=>{
      if(Html5QrcodeSupportedFormats[f]) fmts.push(Html5QrcodeSupportedFormats[f]);
    });
    if(fmts.length) cfg.formatsToSupport=fmts;
  }
  scanner.start({facingMode:'environment'},cfg,
    (txt)=>onScan(txt),
    ()=>{}
  ).then(()=>{scanning=true;})
  .catch(e=>{
    console.error(e);
    stopScan();
    document.getElementById('reader').style.display='none';
    document.getElementById('scanOverlay').style.display='none';
    document.getElementById('btnStop').style.display='none';
    document.getElementById('fallbackCam').style.display='flex';
    document.getElementById('fbText').innerHTML='Не удалось запустить камеру.<br>'+e;
  });
}

function stopScan(){
  if(!scanner)return;
  scanner.stop().then(()=>{
    scanning=false;
    scanner.clear();
    scanner=null;
  }).catch(()=>{scanning=false;scanner=null;});
}

function resumeScan(){
  document.getElementById('resultOverlay').style.display='none';
  if(window.isSecureContext){
    startScanner();
  } else {
    document.getElementById('fallbackCam').style.display='flex';
  }
}

function onScan(code){
  const now=Date.now();
  if(code===lastCode && now-lastTime<COOLDOWN)return;
  lastCode=code; lastTime=now;
  if(navigator.vibrate) navigator.vibrate(80);
  stopScan();
  showResult(code);
}

// ==================== CAPTURE (file:// fallback) ====================
async function onCapture(e){
  const f=e.target.files[0];
  if(!f)return;
  toast('🔍 Распознаю...');
  let code=null;

  // 1. BarcodeDetector API (Chrome Android)
  if('BarcodeDetector' in window){
    try{
      const det=new BarcodeDetector({formats:['ean_13','ean_8','code_39','code_128','upc_a','upc_e']});
      const bmp=await createImageBitmap(f);
      const codes=await det.detect(bmp);
      if(codes.length>0) code=codes[0].rawValue;
    }catch(e){console.log('BarcodeDetector err',e);}
  }

  // 2. html5-qrcode scanFile
  if(!code && typeof Html5Qrcode!=='undefined'){
    try{
      const temp=new Html5Qrcode('reader');
      const res=await temp.scanFile(f,false);
      code=res.text||res;
      await temp.clear();
    }catch(e){console.log('scanFile err',e);}
  }

  if(code){
    toast('✅ Распознано: '+code);
    onScan(code);
  } else {
    toast('❌ Не распознано. Попробуйте сфотографировать крупнее.',true);
  }
  e.target.value='';
}

function manualInput(){
  const c=prompt('Введите штрихкод:');
  if(c && c.trim()) onScan(c.trim());
}

// ==================== SHOW RESULT ====================
function showResult(code){
  const item=DB.find(r=>String(r.Штрихкод).trim()===String(code).trim());
  const prev=SCANS.find(s=>s.barcode===code);
  document.getElementById('resBarcode').textContent=code;

  let h='';
  if(item){
    h+='<span class="status-chip st-ok">✅ Найден в базе</span>';
    h+=info('Название формы',item.НазваниеФормы);
    h+=info('Код формы',item.КодФормы);
    h+=info('Место хранения',item.МестоХранения);
    h+=info('Последний статус',item.ПоследнийСтатус);
  } else {
    h+='<span class="status-chip st-err">⚠️ Не найден в базе</span>';
  }
  if(prev && prev.note){
    h+='<div class="prev-note"><b>📝 Предыдущее примечание ('+fmtTime(prev.time)+')</b><br>'+esc(prev.note)+'</div>';
  }
  h+='<textarea class="note-area" id="noteInput" placeholder="Всё соответствует — оставьте пустым и нажмите Подтвердить. Расхождения — опишите здесь.">'+esc(prev?prev.note:'')+'</textarea>';

  document.getElementById('resBody').innerHTML=h;
  document.getElementById('resultOverlay').style.display='block';
  document.getElementById('scanOverlay').style.display='none';
  document.getElementById('btnStop').style.display='none';
}

function info(l,v){return '<div class="info-row"><span class="info-label">'+l+'</span><span class="info-val">'+esc(v)+'</span></div>';}

function saveScan(confirmed){
  const note=document.getElementById('noteInput')?document.getElementById('noteInput').value.trim():'';
  SCANS=SCANS.filter(s=>s.barcode!==lastCode);
  const item=DB.find(r=>String(r.Штрихкод).trim()===lastCode);
  SCANS.unshift({
    barcode:lastCode,time:new Date().toISOString(),
    confirmed:confirmed&&!note,note:note,
    name:item?item.НазваниеФормы:'',code:item?item.КодФормы:'',
    location:item?item.МестоХранения:'',status:item?item.ПоследнийСтатус:''
  });
  saveLS(); updateStats();
  toast(note?'Примечание сохранено':(confirmed?'Подтверждено':'Сохранено'));
  document.getElementById('resultOverlay').style.display='none';
  resumeScan();
}

// ==================== FILE UPLOAD ====================
function onFile(e){
  const f=e.target.files[0];
  if(!f){return;}
  document.getElementById('fileStatus').style.display='none';
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='xlsx'||ext==='xls'){readXLSX(f);}else{readCSV(f);}
}

function readXLSX(file){
  if(typeof XLSX==='undefined'){fileErr('Библиотека Excel не загружена');return;}
  const r=new FileReader();
  r.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(sheet,{header:1});
      if(json.length<2){fileErr('Файл пуст');return;}
      const hdr=json[0].map(h=>String(h).trim());
      const rows=json.slice(1).map(row=>{const o={};hdr.forEach((h,i)=>o[h]=row[i]!==undefined?String(row[i]).trim():'');return o;});
      processRows(rows);
    }catch(err){fileErr('Ошибка Excel: '+err.message);}
  };
  r.readAsArrayBuffer(file);
}

function readCSV(file){
  const r=new FileReader();
  r.onload=function(e){
    let txt=e.target.result;
    if(/[ÐÑÒÓÔÕÖ×ØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõö÷øùúûüýþÿ]/.test(txt.slice(0,500))){
      const r2=new FileReader();
      r2.onload=function(e2){parseCSV(e2.target.result);};
      r2.readAsText(file,'windows-1251');
    } else {parseCSV(txt);}
  };
  r.readAsText(file,'UTF-8');
}

function parseCSV(text){
  const lines=text.split(/?
/).filter(l=>l.trim());
  if(lines.length<2){fileErr('CSV пуст');return;}
  const sep=lines[0].includes('	')?'	':',';
  const hdr=lines[0].split(sep).map(h=>h.trim().replace(/^["']|["']$/g,''));
  const rows=lines.slice(1).map(line=>{
    const vals=line.split(sep).map(v=>v.trim().replace(/^["']|["']$/g,''));
    const o={};hdr.forEach((h,i)=>o[h]=vals[i]||'');return o;
  });
  processRows(rows);
}

function processRows(data){
  const mapped=data.map(row=>{
    const k=Object.keys(row);
    const find=(vars)=>{for(const v of vars){const f=k.find(x=>x.toLowerCase()===v.toLowerCase());if(f)return row[f];}return'';};
    return{
      НазваниеФормы:find(['НазваниеФормы','Название','Name']),
      КодФормы:find(['КодФормы','Код','Code']),
      Штрихкод:String(find(['Штрихкод','Barcode','EAN','ШК'])||'').trim(),
      МестоХранения:find(['МестоХранения','Место','Location']),
      ПоследнийСтатус:find(['ПоследнийСтатус','Статус','Status'])
    };
  }).filter(r=>r.Штрихкод);
  if(!mapped.length){fileErr('Не найдено записей с штрихкодом');return;}
  DB=mapped; saveLS(); updateStats();
  toast('✅ Загружено '+mapped.length+' записей');
  renderPreview();
}

function renderPreview(){
  const c=document.getElementById('dataPreview');
  let h='<h3 style="margin:0 16px 10px;font-size:1rem">📋 '+DB.length+' записей</h3>';
  h+='<table class="preview-table"><thead><tr><th>Штрихкод</th><th>Название</th><th>Место</th></tr></thead><tbody>';
  DB.slice(0,50).forEach(r=>{
    h+='<tr><td>'+esc(String(r.Штрихкод))+'</td><td>'+esc(r.НазваниеФормы)+'</td><td>'+esc(r.МестоХранения)+'</td></tr>';
  });
  if(DB.length>50) h+='<tr><td colspan="3" style="text-align:center;color:#8b949e">... и ещё '+(DB.length-50)+'</td></tr>';
  h+='</tbody></table>';
  c.innerHTML=h;
}

function fileErr(msg){const el=document.getElementById('fileStatus');el.textContent='⚠️ '+msg;el.style.display='block';}

// ==================== HISTORY ====================
function renderHist(){
  const q=document.getElementById('histSearch').value.toLowerCase();
  const c=document.getElementById('histList');
  let f=SCANS;
  if(q) f=SCANS.filter(s=>(s.barcode+'').toLowerCase().includes(q)||(s.name+'').toLowerCase().includes(q));
  if(!f.length){c.innerHTML='<div style="text-align:center;color:#484f58;padding:40px">История пуста</div>';return;}
  c.innerHTML=f.map(s=>{
    const cls=s.note?'has-note':(s.confirmed?'confirmed':'');
    return '<div class="hist-item '+cls+'" onclick="showResult(''+s.barcode+'');goTab(0);">'+
      '<div><div class="hist-barcode">'+s.barcode+'</div><div style="color:#c9d1d9;font-size:.85rem">'+esc(s.name||'Не найден')+'</div>'+(s.note?'<div class="hist-note">📝 '+esc(s.note)+'</div>':'')+'</div>'+
      '<div class="hist-time">'+fmtTime(s.time)+'</div></div>';
  }).join('');
}

// ==================== EXPORT ====================
function toCSV(rows){
  return rows.map(r=>r.map(c=>{
    const s=String(c||'');
    if(s.includes(',')||s.includes('"')||s.includes('
')) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }).join(',')).join('
');
}

function exportResults(){
  if(!SCANS.length){toast('Нет данных');return;}
  const rows=[['Штрихкод','НазваниеФормы','КодФормы','МестоХранения','ПоследнийСтатус','СтатусПроверки','Примечание','Время']];
  SCANS.forEach(s=>rows.push([s.barcode,s.name,s.code,s.location,s.status,s.confirmed?'Подтверждено':(s.note?'Примечание':'Проверено'),s.note||'',s.time]));
  download('﻿'+toCSV(rows),'inventory_results.csv');
  toast('📥 Скачан');
}

function exportFull(){
  const sm={}; SCANS.forEach(s=>sm[s.barcode]=s);
  const rows=[['НазваниеФормы','КодФормы','Штрихкод','МестоХранения','ПоследнийСтатус','Проверено','СтатусПроверки','Примечание','Время']];
  DB.forEach(i=>{
    const s=sm[i.Штрихкод];
    rows.push([i.НазваниеФормы,i.КодФормы,i.Штрихкод,i.МестоХранения,i.ПоследнийСтатус,s?'Да':'Нет',s?(s.confirmed?'Подтверждено':(s.note?'Примечание':'Проверено')):'',s?(s.note||''):'',s?s.time:'']);
  });
  SCANS.filter(s=>!DB.find(i=>i.Штрихкод===s.barcode)).forEach(s=>{
    rows.push(['НЕ НАЙДЕН В БАЗЕ','',s.barcode,'','','Да',s.confirmed?'Подтверждено':(s.note?'Примечание':'Проверено'),s.note||'',s.time]);
  });
  download('﻿'+toCSV(rows),'inventory_full.csv');
  toast('📥 Отчёт скачан');
}

function download(text,name){
  const blob=new Blob([text],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
}

function clearAll(){
  if(!confirm('Очистить ВСЁ?'))return;
  DB=[];SCANS=[];saveLS();updateStats();
  document.getElementById('dataPreview').innerHTML='';
  renderHist();
  toast('Очищено');
}

// ==================== TABS ====================
function goTab(i){
  document.querySelectorAll('.page').forEach((p,idx)=>p.classList.toggle('active',idx===i));
  document.querySelectorAll('.nav-btn').forEach((b,idx)=>b.classList.toggle('active',idx===i));
  if(i===2) renderHist();
}

// ==================== STORAGE ====================
function saveLS(){localStorage.setItem('inv_db',JSON.stringify(DB));localStorage.setItem('inv_sc',JSON.stringify(SCANS));}
function loadLS(){try{const d=localStorage.getItem('inv_db'),s=localStorage.getItem('inv_sc');if(d)DB=JSON.parse(d);if(s)SCANS=JSON.parse(s);}catch(e){}}
function updateStats(){document.getElementById('stItems').textContent=DB.length;document.getElementById('stScans').textContent=SCANS.length;}

// ==================== UTILS ====================
function esc(t){if(!t)return'';const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function fmtTime(iso){if(!iso)return'';try{const d=new Date(iso);return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
